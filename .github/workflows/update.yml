name: Update V2Ray Sub

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository 🛎️
        uses: actions/checkout@v3

      - name: Set up Python 🐍
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies 📦
        run: |
          pip install requests

      - name: Prepare Folders and Files 📄
        run: |
          mkdir -p protocols countries
          touch sub.txt

      - name: Run Scraper 👾
        # متغیرهای محیطی که کد پایتون بهشون نیاز داره رو از Secretها می‌گیریم
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scraper.py

      - name: Commit and Push 🚀
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add sub.txt protocols/ countries/
          
          git diff --staged --quiet || (git commit -m "🤖 Auto-update & categorize configs: $(date +'%Y-%m-%d %H:%M')" && git push)
