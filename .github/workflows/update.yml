name: Update V2Ray Sub
on:
  schedule:
    - cron: "0 */6 * * *" # هر 6 ساعت ⏰
  workflow_dispatch: # دکمه اجرای دستی برای وقتایی که عجله داری! 🏃‍♂️

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: Run Scraper 🕷️
        run: python scraper.py
      - name: Commit and Push 🚀
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # بررسی می‌کنیم آیا فایل اصلا وجود خارجی داره یا نه
          if [ -f "sub.txt" ]; then
            git add sub.txt
            # فقط اگه فایل تغییر کرده بود کامیت کن تا ارور الکی نده
            git diff --staged --quiet || (git commit -m "🤖 Auto-update configs [skip ci]" && git push)
          else
            echo "🚨 ارور فاجعه‌بار: فایل sub.txt اصلاً ساخته نشده!"
            exit 1
          fi
