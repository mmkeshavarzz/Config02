name: Update V2Ray Sub
on:
  schedule:
    - cron: "0 */6 * * *" # هر 6 ساعت ⏰
  workflow_dispatch: # دکمه اجرای دستی برای وقتایی که عجله داری! 🏃‍♂️

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: Run Scraper 🕷️
        run: python scraper.py
      - name: Commit and Push 🚀
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # لیست فایل‌ها رو پرینت کن ببینیم چیا ساخته شده
          ls -la
          
          if [ -f "sub.txt" ]; then
            git add sub.txt
            git diff --staged --quiet || (git commit -m "🤖 Auto-update configs" && git push)
            echo "🔥 همه چیز با موفقیت پوش شد!"
          else
            echo "❌ فایل sub.txt ساخته نشده که بخوام کامیت کنم!"
            exit 1
          fi
