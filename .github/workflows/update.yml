name: Update V2Ray Sub

on:
  schedule:
    # هر ۶ ساعت یک‌بار به وقت گرینویچ
    - cron: '0 */6 * * *'
  workflow_dispatch: # دکمه اجرای دستی

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository 🛎️
        uses: actions/checkout@v3

      - name: Set up Python 🐍
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies 📦
        run: |
          pip install requests

      # 🪄 ترفند نجات: ساخت پیشاپیش فایل تا گیت بهانه‌گیری نکنه
      - name: Pre-create sub.txt 📄
        run: |
          touch sub.txt

      - name: Run Scraper 👾
        run: |
          python scraper.py

      - name: Commit and Push 🚀
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # فقط در صورتی کامیت می‌کنه که تغییری ایجاد شده باشه
          git add sub.txt
          git diff --staged --quiet || (git commit -m "🤖 Auto-update configs: $(date +'%Y-%m-%d %H:%M')" && git push)
